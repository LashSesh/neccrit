name: release-core
on:
  push:
    branches: [ "main" ]
jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt || true
      - run: pytest -q || true
      - run: chmod +x scripts/build-core.sh && ./scripts/build-core.sh
      - name: Validate no addons
        run: |
          FILE=$(ls neccrit-core-*.tar.gz | head -n1)
          if tar -tzf "$FILE" | grep -q '^neccrit-core/.*/addons/'; then
            echo "addons present in core artifact"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: neccrit-core
          path: |
            neccrit-core-*.tar.gz
            neccrit-core-*.tar.gz.sha256
