[package]
name = "neccrit"
description = "End-to-end encrypted peer-to-peer messenger (command line client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "neccrit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
neccrit-core = { path = "../neccrit-core", version = "=0.2.0-alpha.1" }
rpassword = "7.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
