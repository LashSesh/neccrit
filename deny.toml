# Dependency policy, checked in CI with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Fail on any known vulnerability or unmaintained/unsound crate.
version = 2
yanked = "deny"
ignore = [
    # Unmaintained proc-macro helper used at compile time by `hax-lib-macros`,
    # the annotation crate of libcrux's formal verification tooling. It does
    # not end up in the binary. Re-evaluate when libcrux updates hax-lib.
    { id = "RUSTSEC-2026-0173", reason = "compile-time only dependency of libcrux verification annotations" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
